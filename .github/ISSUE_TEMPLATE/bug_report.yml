name: "Informe de incidencia"
description: "Reportar un error reproducible sin datos privados"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "No incluyas contraseñas, tokens, datos clínicos identificables ni detalles de vulnerabilidades. Para seguridad sigue SECURITY.md."
  - type: input
    id: version
    attributes:
      label: "Versión o SHA del commit"
      placeholder: "v0.x o 40 caracteres de commit"
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: "Entorno donde se observó"
      options:
        - "Simulación / demo"
        - "Navegador real"
        - "Prueba automatizada"
        - "Hardware físico autorizado"
        - "Sin verificar"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Pasos mínimos para reproducir"
      placeholder: "1. Abrir... 2. Configurar... 3. Ejecutar..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Resultado esperado"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Resultado observado y evidencia depurada"
      description: "Indica si los logs y capturas son de una demo, dispositivo o simulador"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Qué no se ha comprobado"
      description: "Limitaciones del diagnóstico para evitar falsas certezas"
